<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Salsas">
<meta name="theme-color" content="#111111">
<title>Salsas — kitchen view</title>
<style>
  :root {
    --bg: #111111;
    --panel: #1c1c1c;
    --line: #3a3a3a;
    --text: #ffffff;
    --muted: #c9c9c9;
    --verde: #7ee08a;
    --roja: #ff8a7a;
    --accent: var(--verde);
    --flag-bg: #3a2e00;
    --flag-text: #ffe27a;
    --done: #8a8a8a;
    --tap: 64px;
  }
  body[data-tab="roja"] { --accent: var(--roja); }
  * { box-sizing: border-box; }
  html { font-size: clamp(20px, 2.4vmin + 6px, 28px); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    line-height: 1.35; -webkit-tap-highlight-color: transparent;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button { font: inherit; color: inherit; }

  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 2px solid var(--line);
    padding: 0.5rem 0.75rem; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;
  }
  .tabs { display: flex; gap: 0.5rem; flex: 1 1 auto; }
  .tab {
    min-height: var(--tap); padding: 0 1rem; border-radius: 14px; border: 3px solid var(--line);
    background: var(--panel); font-size: 1.1rem; font-weight: 700; cursor: pointer;
  }
  .tab[aria-selected="true"][data-tab="verde"] { border-color: var(--verde); background: #163a1b; }
  .tab[aria-selected="true"][data-tab="roja"] { border-color: var(--roja); background: #45180f; }
  .pill {
    min-height: 48px; padding: 0 0.8rem; border-radius: 999px; border: 2px solid var(--line);
    background: var(--panel); font-size: 0.75rem; font-weight: 600; display: inline-flex; align-items: center; gap: 0.4rem; cursor: pointer;
  }
  .pill .dot { width: 0.7rem; height: 0.7rem; border-radius: 50%; background: #888; }
  .pill[data-state="on"] .dot { background: var(--verde); }
  .pill[data-state="off"] { border-color: var(--flag-text); color: var(--flag-text); }
  .pill[data-state="off"] .dot { background: var(--flag-text); }

  #timers { display: flex; gap: 0.5rem; flex-wrap: wrap; width: 100%; }
  #timers:empty { display: none; }
  .timer {
    min-height: var(--tap); padding: 0 1rem; border-radius: 14px; border: 3px solid var(--accent);
    background: var(--panel); font-size: 1.3rem; font-weight: 800; font-variant-numeric: tabular-nums; cursor: pointer;
  }
  .timer.ringing { background: var(--flag-text); color: #000; border-color: var(--flag-text); animation: blink 0.8s steps(2) infinite; }
  @keyframes blink { 50% { background: #000; color: var(--flag-text); } }

  main { padding: 0.75rem 1rem 3rem; max-width: 1400px; margin: 0 auto; }
  .recipe[hidden] { display: none; }
  h1 { font-size: 1.9rem; margin: 0.25rem 0 0.15rem; color: var(--accent); }
  .sub { color: var(--muted); font-size: 0.95rem; margin: 0 0 0.75rem; }
  h2 {
    font-size: 1rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
    margin: 1rem 0 0.5rem; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
  }
  .reset {
    min-height: 48px; padding: 0 0.9rem; border-radius: 12px; border: 2px solid var(--line);
    background: transparent; color: var(--muted); font-size: 0.75rem; letter-spacing: 0.04em; cursor: pointer;
  }
  .cols { display: grid; gap: 0 2rem; grid-template-columns: 1fr; }
  @media (min-width: 900px) and (orientation: landscape) {
    .cols { grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); align-items: start; }
  }

  ul.items, ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; }
  .item, .step {
    display: grid; grid-template-columns: auto 1fr; gap: 0.75rem; align-items: start;
    background: var(--panel); border: 2px solid var(--line); border-radius: 16px;
    padding: 0.7rem 0.85rem; cursor: pointer; user-select: none; -webkit-user-select: none;
    min-height: var(--tap);
  }
  .item { font-size: 1.2rem; }
  .step { font-size: 1.3rem; }
  .box {
    width: 2.1rem; height: 2.1rem; border-radius: 10px; border: 3px solid var(--accent);
    display: grid; place-items: center; font-weight: 800; font-size: 1.05rem; flex: none;
  }
  .step .box { border-radius: 50%; }
  .done { border-color: #2a2a2a; background: #161616; }
  .done .text { color: var(--done); text-decoration: line-through; text-decoration-thickness: 2px; }
  .done .box { background: var(--accent); color: #000; }
  .metric { color: var(--muted); font-size: 0.85em; }
  .flag {
    display: block; margin-top: 0.4rem; padding: 0.35rem 0.6rem; border-radius: 10px;
    background: var(--flag-bg); color: var(--flag-text); font-size: 0.78rem; text-decoration: none; line-height: 1.3;
  }
  .done .flag { opacity: 0.6; }
  .tbtn {
    display: inline-flex; align-items: center; gap: 0.3rem; margin: 0.15rem 0.15rem; padding: 0.15rem 0.7rem;
    min-height: 48px; border-radius: 12px; border: 3px solid var(--accent); background: #000;
    font-weight: 800; font-size: 1.05rem; cursor: pointer; vertical-align: middle; text-decoration: none;
  }
  .notes { margin-top: 0.75rem; color: var(--muted); font-size: 0.9rem; }
  .notes p { margin: 0.3rem 0; }

  details.alt { margin-top: 1.5rem; border: 2px dashed var(--line); border-radius: 18px; padding: 0 0.85rem; }
  details.alt summary {
    min-height: var(--tap); display: flex; align-items: center; gap: 0.6rem; cursor: pointer;
    font-size: 1.15rem; font-weight: 700; list-style: none;
  }
  details.alt summary::-webkit-details-marker { display: none; }
  details.alt summary::before { content: "＋"; color: var(--accent); font-weight: 900; }
  details.alt[open] summary::before { content: "－"; }
  details.alt[open] { padding-bottom: 0.85rem; }
  footer { color: #8a8a8a; font-size: 0.7rem; text-align: center; padding: 1rem; }
</style>
</head>
<body data-tab="verde">
<header>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="verde" aria-selected="true">Salsa Verde</button>
    <button class="tab" role="tab" data-tab="roja" aria-selected="false">Salsa Roja</button>
  </div>
  <button class="pill" id="wake" data-state="pending" aria-live="polite"><span class="dot"></span><span id="wake-text">Keeping screen on…</span></button>
  <div id="timers" aria-live="polite"></div>
</header>
<main id="main"></main>
<footer>From the Casa Jacaranda cooking-class book. Yellow notes flag where the book is unclear. Checkmarks are saved on this device.</footer>

<script>
// Recipe text follows the book. Quantities are never added; gaps are flagged instead.
const RECIPES = {
  verde: {
    title: "Salsa Verde — cooked",
    sub: "Grilled, blended, then fried and simmered. Book: the salsa from Enchiladas Casa Jacaranda.",
    ingredients: [
      { t: "4 lb tomatillos", m: "about 2 kg" },
      { t: "¼ onion", m: "about 2.3 oz / 66.5 g" },
      { t: "4 chiles serranos or jalapeños", flag: "Book lists 4, but step 1 grills only 2." },
      { t: "Garlic", flag: "Step 2 blends in garlic, but the book doesn’t say how much." },
      { t: "2 tablespoons vegetable oil", m: "for frying the salsa" },
      { t: "Salt to taste" },
    ],
    steps: [
      "Cut the tomatillos and grill them in a pan or comal until charred on all sides. Grill 2 chiles at the same time.",
      "Blend the cooked tomatillos, chiles, raw onion, and garlic.",
      "In a pan with two tablespoons of hot oil, fry one cup of the salsa. Wait for about 3 minutes {timer:3}, until it caramelizes and small holes form on the surface, then add the rest of the salsa.",
      "Let the salsa simmer on low heat for 10 minutes {timer:10}. Add salt to taste.",
    ],
    notes: [
      "These amounts are the book’s full enchilada batch (serves 6, 18–20 tortillas). The book doesn’t say how much salsa it makes.",
    ],
    alt: {
      title: "Alternate: raw Salsa Verde Chilanga",
      sub: "Makes about 1 qt. Uncooked, with raw onion. The book says it loses its sharp brightness quickly and is best the day you make it.",
      ingredients: [
        { t: "5 green tomatoes or tomatillos", m: "about 8.6 oz / 245 g" },
        { t: "¼ onion", m: "about 2.35 oz / 66.5 g" },
        { t: "2 serrano chiles" },
        { t: "1 handful of cilantro with stems", m: "about 1.3 oz / 37 g" },
        { t: "Salt to taste" },
      ],
      steps: [
        "Grind all ingredients with salt in a blender.",
        "Adjust salt to taste.",
      ],
    },
  },
  roja: {
    title: "Salsa Roja",
    sub: "Makes about 1 qt. Everything roasted, then ground.",
    ingredients: [
      { t: "6 tomatoes", flag: "The book doesn’t give a tomato size or a smaller batch." },
      { t: "1 slice of onion" },
      { t: "3 dried chipotle chiles (chipotle morita)", m: "can substitute canned chipotle", flag: "The book only names chipotle morita. Swapping in another dried chile isn’t covered." },
      { t: "1 small clove garlic" },
      { t: "1½ teaspoons salt", flag: "Step 5 says add salt to taste." },
    ],
    steps: [
      "Roast the dried chipotle chiles until they inflate, being careful not to burn them. If using canned chipotle, do not roast.",
      "Lightly roast the garlic until cooked, avoiding charring.",
      "Roast the tomatoes and onion in a pan or comal until they are charred.",
      "Grind all the ingredients in a molcajete, or blender, starting with the garlic, onion, chiles, and tomatoes. If using a molcajete, the tomatoes’ own juices will be sufficient for blending.",
      "Add salt to taste.",
    ],
    notes: [],
  },
};

const KEY = "salsa-view-v1";
let state;
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { state = {}; }
state.checked ||= {};
state.timers ||= [];
state.tab ||= "verde";
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function stepHtml(text) {
  return esc(text).replace(/\{timer:(\d+)\}/g, (_, m) =>
    `<button class="tbtn" data-min="${m}" aria-label="Start ${m} minute timer">⏱ ${m} min</button>`);
}

function block(id, r, level) {
  const items = r.ingredients.map((it, i) => {
    const k = `${id}:i${i}`;
    return `<li class="item${state.checked[k] ? " done" : ""}" data-k="${k}" role="checkbox" aria-checked="${!!state.checked[k]}">
      <span class="box">${state.checked[k] ? "✓" : ""}</span>
      <span><span class="text">${esc(it.t)}${it.m ? ` <span class="metric">(${esc(it.m)})</span>` : ""}</span>${it.flag ? `<span class="flag">⚑ ${esc(it.flag)}</span>` : ""}</span>
    </li>`;
  }).join("");
  const steps = r.steps.map((s, i) => {
    const k = `${id}:s${i}`;
    return `<li class="step${state.checked[k] ? " done" : ""}" data-k="${k}" role="checkbox" aria-checked="${!!state.checked[k]}">
      <span class="box">${state.checked[k] ? "✓" : i + 1}</span>
      <span class="text">${stepHtml(s)}</span>
    </li>`;
  }).join("");
  return `${level === 1 ? `<h1>${esc(r.title)}</h1>` : ""}<p class="sub">${esc(r.sub)}</p>
    <div class="cols">
      <section><h2>Ingredients <button class="reset" data-reset="${id}">Start over</button></h2><ul class="items">${items}</ul></section>
      <section><h2>Steps</h2><ol class="steps">${steps}</ol>
        ${r.notes && r.notes.length ? `<div class="notes">${r.notes.map(n => `<p>${esc(n)}</p>`).join("")}</div>` : ""}
      </section>
    </div>`;
}

function render() {
  const main = document.getElementById("main");
  main.innerHTML = Object.entries(RECIPES).map(([id, r]) => `
    <article class="recipe" data-recipe="${id}" ${state.tab === id ? "" : "hidden"}>
      ${block(id, r, 1)}
      ${r.alt ? `<details class="alt" ${state.altOpen ? "open" : ""}><summary>${esc(r.alt.title)}</summary>${block(id + "-alt", r.alt, 2)}</details>` : ""}
    </article>`).join("");
  document.body.dataset.tab = state.tab;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === state.tab));
  const alt = main.querySelector("details.alt");
  if (alt) alt.addEventListener("toggle", () => { state.altOpen = alt.open; save(); });
}

document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab");
  if (!b) return;
  state.tab = b.dataset.tab; save(); render(); window.scrollTo(0, 0);
});

document.getElementById("main").addEventListener("click", e => {
  const t = e.target.closest(".tbtn");
  if (t) { e.stopPropagation(); startTimer(+t.dataset.min); return; }
  const r = e.target.closest("[data-reset]");
  if (r) {
    const p = r.dataset.reset + ":";
    Object.keys(state.checked).forEach(k => { if (k.startsWith(p)) delete state.checked[k]; });
    // Clears the ingredients and steps of that recipe together.
    save(); render(); return;
  }
  const row = e.target.closest("[data-k]");
  if (!row) return;
  const k = row.dataset.k;
  if (state.checked[k]) delete state.checked[k]; else state.checked[k] = true;
  save(); render();
});

// ---- Timers ----
let audio;
function beep() {
  try {
    audio ||= new (window.AudioContext || window.webkitAudioContext)();
    const now = audio.currentTime;
    for (let i = 0; i < 3; i++) {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0.0001, now + i * 0.5);
      g.gain.exponentialRampToValueAtTime(0.6, now + i * 0.5 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.5 + 0.35);
      o.start(now + i * 0.5); o.stop(now + i * 0.5 + 0.4);
    }
  } catch (e) {}
}
function startTimer(min) {
  try { audio ||= new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
  state.timers.push({ id: Date.now(), min, end: Date.now() + min * 60000 });
  save(); drawTimers();
}
function drawTimers() {
  const box = document.getElementById("timers");
  const now = Date.now();
  box.innerHTML = state.timers.map(t => {
    const left = Math.max(0, Math.round((t.end - now) / 1000));
    const label = left > 0 ? `⏱ ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}` : `⏰ ${t.min} min done — tap to clear`;
    return `<button class="timer${left === 0 ? " ringing" : ""}" data-id="${t.id}" aria-label="${left > 0 ? "Cancel timer" : "Clear timer"}">${label}${left > 0 ? " ✕" : ""}</button>`;
  }).join("");
}
document.getElementById("timers").addEventListener("click", e => {
  const b = e.target.closest(".timer");
  if (!b) return;
  state.timers = state.timers.filter(t => String(t.id) !== b.dataset.id);
  save(); drawTimers();
});
setInterval(() => {
  const now = Date.now();
  state.timers.forEach(t => {
    if (t.end <= now && !t.rang) { t.rang = true; save(); }
    if (t.end <= now && now - t.end < 60000 && (Math.floor((now - t.end) / 1000) % 4 === 0)) beep();
  });
  drawTimers();
}, 1000);

// ---- Keep the screen awake ----
// Screen Wake Lock first; a muted looping inline video is the fallback for browsers without it.
const pill = document.getElementById("wake"), pillText = document.getElementById("wake-text");
let lock = null, video = null;
function setWake(s, text) { pill.dataset.state = s; pillText.textContent = text; }
async function keepAwake() {
  if (lock) return;
  if ("wakeLock" in navigator) {
    try {
      lock = await navigator.wakeLock.request("screen");
      lock.addEventListener("release", () => { lock = null; if (document.visibilityState === "visible") setWake("off", "Tap to keep screen on"); });
      setWake("on", "Screen stays on");
      return;
    } catch (e) { /* fall through to the video fallback */ }
  }
  if (!video) {
    video = document.createElement("video");
    video.src = "keepawake.mp4";
    video.muted = true; video.loop = true; video.playsInline = true;
    video.setAttribute("muted", ""); video.setAttribute("playsinline", "");
    video.style.cssText = "position:fixed;width:1px;height:1px;opacity:0.01;bottom:0;right:0;pointer-events:none";
    document.body.appendChild(video);
  }
  try { await video.play(); setWake("on", "Screen stays on"); }
  catch (e) { setWake("off", "Tap to keep screen on"); }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { lock = null; keepAwake(); } });
// Some browsers only grant the lock after a tap, so retry on every interaction until it holds.
document.addEventListener("pointerdown", () => { if (pill.dataset.state !== "on") keepAwake(); }, { passive: true });
pill.addEventListener("click", keepAwake);

render(); drawTimers(); keepAwake();
</script>
</body>
</html>
